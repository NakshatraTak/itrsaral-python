[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itrsaral"
version = "0.1.0"
description = "Verified Indian tax constants — slabs, TDS, GST, professional tax, small-savings rates — in one import. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anurag Kumar Pandey" }]
keywords = [
    "india", "tax", "income-tax", "gst", "tds", "professional-tax",
    "ppf", "epf", "nps", "payroll", "itr", "finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
# No runtime dependencies, on purpose — see the README.
dependencies = []

[project.urls]
Homepage = "https://itrsaral.in"
Data = "https://itrsaral.in/data"
Source = "https://github.com/NakshatraTak/itrsaral-python"
Issues = "https://github.com/NakshatraTak/itrsaral-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/itrsaral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
