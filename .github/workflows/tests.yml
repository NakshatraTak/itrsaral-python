name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:00 UTC — the live check below catches an upstream shape change
    # before someone's payroll run does.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit tests (offline, against fixtures)
        run: pytest -q

  live:
    # Separate job: if itrsaral.in is down, the unit tests above still report green.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Live API still has the shape we expect
        run: |
          python - <<'PY'
          import itrsaral

          assert isinstance(itrsaral.rate("ppf"), (int, float)), "ppf is not a number"
          assert itrsaral.rate_info("ppf")["source"].startswith("http"), "ppf has no source"

          for regime in ("new", "old"):
              bands = itrsaral.tax_slabs(regime)
              assert bands, f"{regime}: no slabs"
              assert bands[-1][0] is None, f"{regime}: last band is not open-ended"

          assert itrsaral.professional_tax("MH", 30000) > 0, "MH should levy PT"
          assert itrsaral.professional_tax("DL", 99999) == 0, "DL should not levy PT"
          assert "itrsaral.in" in itrsaral.attribution()

          print("live API OK — rates:", len(itrsaral.rates()),
                "| verified:", itrsaral.verified_on("rates"))
          PY
